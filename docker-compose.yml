# Local full stack:  docker compose up --build
#   web  -> http://localhost:5173      api -> http://localhost:8000/docs
# Auth and Storage still come from a Supabase project (set SUPABASE_* in .env); the bundled Postgres is for the data layer.
services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-socratiq}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports: ["127.0.0.1:${POSTGRES_PORT:-5432}:5432"]   # bound to localhost only
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-socratiq}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-socratiq}
    # A plain Postgres has no Supabase `auth` schema/roles, so create minimal stand-ins first (skipped on real Supabase).
    command: python database/run_migrations.py --local-supabase-stub
    restart: "no"

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-socratiq}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      # In-chat code runner (optional): start it with `--profile code-runner` and set CODE_RUNNER_URL=http://code-runner:8080 + CODE_RUNNER_TOKEN in .env
      CODE_RUNNER_URL: ${CODE_RUNNER_URL:-}
    ports: ["${BACKEND_PORT:-8000}:8000"]
    volumes: [uploads:/app/data/uploads]
    networks: [default, code_runner_net]

  # Executes untrusted student code. Holds NO application secrets, reaches NOTHING but its own internal network (no internet, no database),
  # and runs every job as a separate unprivileged uid under rlimits + seccomp (see docs/CODE_RUNNER.md). Opt-in:
  #   docker compose --profile code-runner up --build
  # Production: run it under gVisor (CODE_RUNNER_RUNTIME=runsc) or on a separate VM; see docs/CODE_RUNNER.md.
  code-runner:
    profiles: ["code-runner"]
    build: ./sandbox/code_runner
    restart: unless-stopped
    runtime: ${CODE_RUNNER_RUNTIME:-runc}
    init: true                                   # reaps orphaned job processes
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,nosuid,nodev,noexec
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE]   # only to give each job its own uid, and to clean up after it
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    environment:
      RUNNER_MAX_CONCURRENCY: ${RUNNER_MAX_CONCURRENCY:-2}
      RUNNER_MAX_TIMEOUT_MS: ${RUNNER_MAX_TIMEOUT_MS:-5000}
      RUNNER_MAX_MEMORY_MB: ${RUNNER_MAX_MEMORY_MB:-256}
    secrets:
      - source: code_runner_token
        target: code_runner_token
    networks: [code_runner_net]

  web:
    build:
      context: frontend
      args:
        VITE_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
        VITE_SUPABASE_URL: ${SUPABASE_URL:-}
        VITE_SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
    restart: unless-stopped
    depends_on: [backend]
    ports: ["${WEB_PORT:-5173}:80"]

volumes:
  pgdata:
  uploads:

networks:
  code_runner_net:
    internal: true                               # no route to the internet or the host network: only backend <-> code-runner

secrets:
  code_runner_token:
    file: ./secrets/code_runner_token            # same value as CODE_RUNNER_TOKEN in .env; `chmod 600` it (see docs/CODE_RUNNER.md)
